# ═══════════════════════════════════════════
#          FROSTED GLASS — HYPRLAND
# ═══════════════════════════════════════════

general {
    gaps_in = 6
    gaps_out = 10

    border_size = 2

    col.active_border = rgba(A5B4FCee) rgba(C4B5FDcc) 45deg
    col.inactive_border = rgba(45435Faa)

    resize_on_border = true
    layout = dwindle
}

# ── WINDOW DECORATION ───────────────────────

decoration {
    rounding = 16
    rounding_power = 2.0

    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(08081766)
    }

    # ── FROSTED GLASS BLUR ──────────────────

    blur {
        enabled = true

        size = 8
        passes = 3

        ignore_opacity = false
        new_optimizations = true

        brightness = 0.90
        contrast = 1.05

        vibrancy = 0.25
        vibrancy_darkness = 0.5
    }
}

# ── ANIMATIONS ──────────────────────────────

animations {
    enabled = true

    bezier = glassEase, 0.22, 1, 0.36, 1

    animation = windows, 1, 5, glassEase, popin
    animation = windowsOut, 1, 4, glassEase, popin
    animation = border, 1, 8, default
    animation = fade, 1, 5, glassEase
    animation = workspaces, 1, 5, glassEase
}
