
# ╔══════════════════════════════════════════╗
# ║              KITTY — GLASS               ║
# ╚══════════════════════════════════════════╝

# ── TYPOGRAPHY ──────────────────────────────
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.5

disable_ligatures never
text_composition_strategy legacy

# ── WINDOW ─────────────────────────────────
remember_window_size yes
initial_window_width 120c
initial_window_height 36c
window_padding_width 16
single_window_padding_width 16
hide_window_decorations yes
confirm_os_window_close 0

# ── GLASS ───────────────────────────────────
background_opacity 0.5
dynamic_background_opacity yes

# ── CURSOR ──────────────────────────────────
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.6
cursor_stop_blinking_after 15.0

# ── PERFORMANCE ─────────────────────────────
repaint_delay 10
input_delay 3
sync_to_monitor yes
enable_audio_bell no
update_check_interval 0

# ── SCROLLBACK ───────────────────────────────
scrollback_lines 20000
scrollback_pager_history_size 10000
scrollback_fill_enlarged_window yes

# ── CLIPBOARD ────────────────────────────────
copy_on_select clipboard
strip_trailing_spaces smart
clipboard_control write-clipboard write-primary

# ── SHELL ───────────────────────────────────
shell /usr/bin/fish
shell_integration enabled

# ── TABS ────────────────────────────────────
tab_bar_edge top
tab_bar_style fade
tab_bar_min_tabs 1
tab_bar_align left
tab_bar_background #171824
tab_bar_margin_width 4
tab_bar_margin_height 5 5
tab_title_template "  {index}: {title}  "

# ── WINDOW BORDERS ───────────────────────────
active_border_color #a5b4fc
inactive_border_color #34364a
bell_border_color #f38ba8
window_border_width 1.5pt

# ── MIDNIGHT GLASS PALETTE ───────────────────
foreground #e2e4f0
background #171824

selection_foreground #171824
selection_background #a5b4fc

cursor #c4b5fd
cursor_text_color #171824

url_color #93c5fd

# ANSI COLORS
color0  #242638
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #cba6f7
color6  #94e2d5
color7  #dce0f0

color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #94e2d5
color15 #ffffff

# ── KEYBOARD ─────────────────────────────────
map ctrl+shift+enter new_window
map ctrl+shift+t new_tab
map ctrl+shift+w close_window

map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

map ctrl+shift+equal increase_font_size
map ctrl+shift+minus decrease_font_size
map ctrl+shift+backspace restore_font_size

map ctrl+shift+f5 load_config_file

# ── USEFUL FEATURES ──────────────────────────
open_url_with default
url_style curly
detect_urls yes
